    /* ── Slack preview panel ── */
    #slack-panel {

    /* ── Toast ── */

    #toast.success { background: #00875a; }

        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></svg>

  <script>
    let projects = [];       // In Progress rows (shown in table)
    let allInProgress = [];
    let allCancelled  = [];
    let totalCount    = 0;
    let gridInstance  = null;
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);

    // ── Known CLPSE Slack IDs (hardcoded + dynamic fallback) ──
    const CLPSE_IDS = {
      'Michael Arlegui': 'W8FL2SQAE',
      'Cory Leeson':     'W8FJ0CQSF',
      'Josh Strong':     'U02KJCLBBSR',
      'Rodney Webb':     'U032MRPSNTE',
      'James Badia':     'WT586QETZ',
      'Konner Vernon':   'U02QNV1DN77',
      'Archana Pratap':  'W91DGG5ST',
      'Mo Hamilton':     'WH412TAHH'
    };
    const _resolvedCache = { ...CLPSE_IDS };

    // Returns "<@USERID>" if found, otherwise the plain name
    async function slackMention(name) {
      if (!name) return 'Unassigned';
      if (_resolvedCache[name]) return `<@${_resolvedCache[name]}>`;
      // Dynamic lookup for any new CLPSEs not in the hardcoded map
      try {
        const res = await window.cowork.callMcpTool(
          'mcp__5bb57945-e88b-477f-b809-be9c74056e5c__slack_search_users',
          { query: name, response_format: 'concise' }
        );
        const match = res.match(/\b([A-Z][A-Z0-9]{5,})\b/);
        if (match) {
          _resolvedCache[name] = match[1];
          return `<@${match[1]}>`;
        }
      } catch (_) {}
      return name; // fallback to plain name
    }

    // ── Helpers ──────────────────────────────────────────────
    function formatDate(d) {
      if (!d) return '—';
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function isOverdue(d) {
      if (!d) return false;
      const dt = new Date(d);
      return !isNaN(dt) && dt < TODAY;
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show ${type}`;
      setTimeout(() => { t.className = ''; }, 3500);
    }

    // ── Extract text from any callMcpTool response shape ────
    function getRawText(raw) {
      // Shape we confirmed: { content: [{ type:"text", text:"..." }] }
      if (raw && raw.content && Array.isArray(raw.content)) {
        return raw.content.filter(c => c.type === 'text').map(c => c.text || '').join('\n');
      }
      if (typeof raw === 'string') return raw;
      if (raw && typeof raw.result === 'string') return raw.result;
      if (raw && typeof raw.text === 'string') return raw.text;
      try { return JSON.stringify(raw, null, 2); } catch(_) { return String(raw); }
    }

    // ── Tab-separated Smartsheet text parser ─────────────────
    function parseSmartsheetRows(text) {
      const results = [];
      let cur = null;

      for (const line of text.split('\n')) {
        if (/^\s+-\s+row_id:/.test(line)) {
          if (cur && cur.requestName) results.push(cur);
          cur = { requestName: null, createdDate: null, expectedLaunchDate: null, assignedTo: null, latestComment: null, clpseStatus: null };
          continue;
        }
        if (!cur) continue;

        const tabIdx = line.indexOf('\t');
        if (tabIdx === -1) continue;

        const colName = line.slice(0, tabIdx).trim();
        const rest    = line.slice(tabIdx + 1);
        const lastTab = rest.lastIndexOf('\t');
        const rawVal  = (lastTab > -1 ? rest.slice(0, lastTab) : rest).trim().replace(/^"/, '').replace(/"$/, '');

        switch (colName) {
          case 'Request Name':         cur.requestName        = rawVal || null; break;
          case 'Created Date':         cur.createdDate        = rawVal ? rawVal.substring(0, 10) : null; break;
          case 'Expected Launch Date': cur.expectedLaunchDate = rawVal || null; break;
          case 'Assigned To (CLPSE)':  cur.assignedTo         = rawVal || null; break;
          case 'Latest Comment':       cur.latestComment      = rawVal || null; break;
          case 'CLPSE Project Status': cur.clpseStatus        = rawVal || null; break;
        }
      }
      if (cur && cur.requestName) results.push(cur);
      return results;
    }

    // ── Data loading ─────────────────────────────────────────
    async function loadData() {
      const statsBar = document.getElementById('stats-bar');
      const tableDiv = document.getElementById('table-container');
      const sendBtn  = document.getElementById('send-slack-btn');
      sendBtn.disabled = true;

      statsBar.innerHTML = `<div style="width:100%;text-align:center;color:#6b778c;font-size:13px;padding:4px 0">⏳ Fetching Smartsheet data…</div>`;
      tableDiv.innerHTML = `<div class="state-box"><div class="icon">⏳</div>Loading…</div>`;

      try {
        // Fetch ALL rows — filter client-side for stats + table
        const raw = await window.cowork.callMcpTool(
          'mcp__aab8ef50-5bd3-4d06-bb8c-e8bbcfccadbc__get_sheet_summary',
          {
            sheet_id: 1794904029456260,
            columns: ['Request Name', 'Created Date', 'Expected Launch Date', 'Assigned To (CLPSE)', 'Latest Comment', 'CLPSE Project Status']
          }
        );

        const text   = getRawText(raw);
        const allRows = parseSmartsheetRows(text);

        allInProgress = allRows.filter(p => p.clpseStatus === 'In Progress');
        allCancelled  = allRows.filter(p => p.clpseStatus === 'Cancelled');
        totalCount    = allRows.length;
        projects      = allInProgress;

        if (allRows.length === 0) {
          const preview = text.slice(0, 800);
          tableDiv.innerHTML = `<div class="state-box error">
            <div class="icon">🔍</div>
            <strong>Parser found 0 rows.</strong> Raw text preview:<br><br>
            <code style="font-size:11px;white-space:pre-wrap;text-align:left;display:block;background:#fff;padding:8px;border-radius:4px;max-height:220px;overflow:auto">${preview.replace(/</g,'&lt;')}</code>
          </div>`;
          statsBar.innerHTML = '';
          return;
        }
        renderStats();
        renderTable();
        sendBtn.disabled = projects.length === 0;

      } catch (err) {
        statsBar.innerHTML = '';
        tableDiv.innerHTML = `<div class="state-box error"><div class="icon">⚠️</div>Error loading data: ${err.message || err}</div>`;
      }
    }

    // ── Stats ────────────────────────────────────────────────
    function renderStats() {
      const now = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

      document.getElementById('stats-bar').innerHTML = `
        <div class="stat">
          <span class="stat-value" style="color:#0052cc">${allInProgress.length}</span>
          <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat">
          <span class="stat-value" style="color:#de350b">${allCancelled.length}</span>
          <span class="stat-label">Cancelled</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat">
          <span class="stat-value">${totalCount}</span>
          <span class="stat-label">Total CLPSE Projects</span>
        </div>
        <span class="last-refreshed">Refreshed ${now}</span>
      `;
    }

    // ── Table ────────────────────────────────────────────────
    function renderTable() {
      const container = document.getElementById('table-container');
      container.innerHTML = '';

      if (!projects.length) {
        container.innerHTML = `<div class="state-box"><div class="icon">🎉</div>No "In Progress" projects found!</div>`;
        return;
      }

      gridInstance = new gridjs.Grid({
        columns: [
          { name: 'CLPSE', width: '145px' },
          { name: 'Request Name', width: '240px' },
          { name: 'Created', width: '110px' },
          { name: 'Expected Launch', width: '128px' },
          { name: 'Latest Comment', width: '290px' }
        ],
        data: projects.map(p => {
          const od = isOverdue(p.expectedLaunchDate);
          const clpseCell = gridjs.html(
            `<span class="badge-clpse">${p.assignedTo || '—'}</span>`
          );
          const launchCell = gridjs.html(
            `${formatDate(p.expectedLaunchDate)}${od ? '<span class="badge-overdue">OVERDUE</span>' : ''}`
          );
          const commentCell = gridjs.html(
            p.latestComment
              ? `<span class="comment-cell" title="${p.latestComment.replace(/"/g,'&quot;')}">${p.latestComment}</span>`
              : `<span class="comment-cell no-comment">No comment</span>`
          );
          return [
            clpseCell,
            p.requestName,
            formatDate(p.createdDate),
            launchCell,
            commentCell
          ];
        }),
        sort: true,
        search: { enabled: true, placeholder: 'Filter projects…' },
        style: {
          table: { 'border-collapse': 'collapse', width: '100%' },
          th: { background: '#f4f5f7' }
        },
        language: { search: { placeholder: '🔍  Filter projects…' } }
      });

      gridInstance.render(container);
    }

    // ── Slack message builder ────────────────────────────────
    async function buildSlackMessage() {
      const dateStr = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      const overdue = projects.filter(p => isOverdue(p.expectedLaunchDate));

      // Resolve all mentions in parallel
      const mentions = await Promise.all(projects.map(p => slackMention(p.assignedTo)));

      const lines = projects.map((p, i) => {
        const od = isOverdue(p.expectedLaunchDate) ? ' ⚠️ *OVERDUE*' : '';
        return `• *${p.requestName}*${od}\n  ↳ CLPSE: ${mentions[i]} | Expected Launch: ${formatDate(p.expectedLaunchDate)}`;
      }).join('\n');

      const overdueNote = overdue.length > 0
        ? `\n⚠️ *${overdue.length} project(s) are past their expected launch date* — please flag any blockers or provide a revised timeline.\n`
        : '';

      return `🔔 *Care Launch — CLPSE Project Update Request* | ${dateStr}

Hey team 👋 Quick check-in on all active Care Launch projects. I need a status update from each of you on your assigned project(s).

*Please do one of the following:*
📝 *Still in progress?* → Reply in thread with your current status, any blockers, and an updated timeline if needed
✅ *Project complete?* → Make sure your *Scope of Project (SOP)* document is filled out and submitted before closing out${overdueNote}

━━━━━━━━━━━━━━━━━━━━━━━━━━━
📋 *Active In-Progress Projects (${projects.length})*:

${lines}
━━━━━━━━━━━━━━━━━━━━━━━━━━━

👍 Please *ACK this message* by adding a ✅ reaction so I know you've seen it.

Thank you for keeping things moving! 🙌
— Guillermo (IT Manager, Techknow Bar)`;
    }

    // ── Event listeners ──────────────────────────────────────
    document.getElementById('refresh-btn').addEventListener('click', loadData);

    document.getElementById('send-slack-btn').addEventListener('click', async () => {
      if (!projects.length) { showToast('No projects loaded — refresh first', 'error'); return; }
      const btn = document.getElementById('send-slack-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Resolving @mentions…';
      try {
        const msg = await buildSlackMessage();
        document.getElementById('message-preview').textContent = msg;
        document.getElementById('slack-panel').style.display = 'block';
        document.getElementById('slack-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></svg> Send Update Request to Slack`;
      }
    });

    document.getElementById('cancel-send-btn').addEventListener('click', () => {
      document.getElementById('slack-panel').style.display = 'none';
    });

    document.getElementById('confirm-send-btn').addEventListener('click', async () => {
      const btn = document.getElementById('confirm-send-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Sending…';

      try {
        const msg = await buildSlackMessage();
        await window.cowork.callMcpTool(
          'mcp__5bb57945-e88b-477f-b809-be9c74056e5c__slack_send_message',
          {
            channel_id: 'C05E9TRFC8K',
            text: msg
          }
        );

        document.getElementById('slack-panel').style.display = 'none';
        showToast('✅ Message sent to #t4i-clpse-carelaunch!', 'success');
      } catch (err) {
        showToast('❌ Send failed: ' + (err.message || err), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '✅ Confirm & Send';
      }
    });

    // ── Init ─────────────────────────────────────────────────
    loadData();
  </script>
</body>
</html>
